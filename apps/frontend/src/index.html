<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>closetAI</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!--
      `connect-src 'self'` obliga a servir SPA y API desde el mismo origen en
      producción. `frame-ancestors` no va aquí: el navegador lo ignora en un
      <meta> y debe enviarlo el servidor como cabecera (nginx, Fase 8).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
    default-src 'self';
    connect-src 'self';
    img-src 'self' data: blob:;
    font-src 'self' https://fonts.gstatic.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    script-src 'self';
    base-uri 'self';
    object-src 'none';
    form-action 'self'
  "
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
