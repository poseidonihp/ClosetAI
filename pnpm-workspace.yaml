packages:
  - 'apps/*'
  - 'packages/*'

# Una sola copia de Fastify en todo el árbol: `@nestjs/platform-fastify` fija
# 4.28.1 exacta y, con dos versiones instaladas, la ampliación de tipos de
# `@fastify/cookie` deja de aplicar al adaptador de Nest y `register()` no compila.
overrides:
  fastify: 4.28.1

# pnpm no ejecuta scripts de instalación salvo que se aprueben aquí.
# Todos son binarios nativos o generadores que las herramientas necesitan.
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  prisma: true
  sharp: true
